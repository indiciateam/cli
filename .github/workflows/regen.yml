name: Regen

on:
  workflow_dispatch:
    inputs:
      force:
        description: Create a release even if fallback features are unchanged
        type: boolean
        default: true
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: cli-regen
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  regen:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Sync fallback features
        run: pnpm sync-fallback

      - name: Format generated file
        run: pnpm exec biome check --write src/fallback-features.generated.ts

      - name: Commit fallback
        id: fallback
        run: |
          git add src/fallback-features.generated.ts
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "fallback unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync fallback features from OpenAPI"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHOULD=false
          if [ "${{ steps.fallback.outputs.changed }}" = "true" ]; then
            SHOULD=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "false" ]; then
            SHOULD=true
          fi
          if [ "$SHOULD" != "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "no release"
            exit 0
          fi
          LATEST="$(npm view @indiciaosint/cli version)"
          if [[ ! "$LATEST" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "unexpected npm version: $LATEST"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          while git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; do
            if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "invalid version while bumping: $VERSION"
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          export VERSION
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os
          version = os.environ['VERSION']
          date = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          path = Path('CHANGELOG.md')
          text = path.read_text()
          entry = (
              f'## [{version}] - {date}\n\n'
              '### Changed\n\n'
              '- Synced fallback features from the current Indicia OpenAPI spec.\n\n'
          )
          marker = '## ['
          i = text.find(marker)
          path.write_text(text[:i] + entry + text[i:] if i >= 0 else text.rstrip() + '\n\n' + entry)
          PY
          git add package.json CHANGELOG.md
          git commit -m "chore: release v${VERSION}"
          git push
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "Generated from the current Indicia OpenAPI spec."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "releasing ${VERSION}"

  publish:
    needs: regen
    if: needs.regen.outputs.should_release == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.regen.outputs.version }}
    secrets: inherit
