name: Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: CLI version to publish (semver, no v prefix)
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: cli-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "invalid version: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved $VERSION"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.version.outputs.version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Align package version
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if npm view "@indiciaosint/cli@$CURRENT" version >/dev/null 2>&1; then
            echo "already published @indiciaosint/cli@$CURRENT"
          else
            pnpm publish --provenance --no-git-checks --access public
          fi
